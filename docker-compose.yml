services:

  mysql:
    image: mysql:8.4
    container_name: bde-events-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bde_events
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    image: badrbelabrik/bde-events-api:v1
    container_name: bde-events-api
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "base64:TvvPpHgZ4V41L4hiPpkTTi6zNF0PaK+PgMUTVuMSb4Y="
      APP_URL: http://localhost:8000

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: bde_events
      DB_USERNAME: root
      DB_PASSWORD: root

      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database

  react:
    image: badrbelabrik/bde-events-react:v1
    container_name: bde-events-react
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  mysql_data: